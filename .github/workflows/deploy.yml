name: Deploy MilOficios

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies and build
        run: |
          npm install
          npm run build --configuration=production

      # Aquí puedes agregar el paso para subir los archivos generados a tu servidor (por ejemplo, mediante FTP o SSH)
