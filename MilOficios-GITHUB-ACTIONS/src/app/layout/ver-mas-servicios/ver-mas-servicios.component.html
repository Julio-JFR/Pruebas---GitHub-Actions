<app-alerta-general 
    *ngIf="mostrarAlerta"
    [tipoAlerta]="tipoAlerta">
    {{mensaje}}
</app-alerta-general>

<app-page-header [subtitulo]="'Solicita tu'" [heading]="'Servicio aquí'"> </app-page-header>
<div class="row" style="width: 100%;margin:0">
    <div class="col-6 col-md-3 raya-separadora-a">
    </div>
    <div class="triangulo-equilatero-bottom-rigth"></div>
    <div class="col-12 raya-separadora-b">
    </div>
</div>
<br>
<div class="row" style="text-align:center;">
    <input type="text" class="form-control offset-3 col-xl-5 col-lg-5 col-md-6 col-sm-7 col-5 filtro" name="filtroTexto"
        placeholder="Buscar" [(ngModel)]="filtroTexto">
</div>
<br>


<div *ngIf="cargando" class="progress" style="height:.1rem">
    <ngb-progressbar class="indeterminate" type="primary" height="auto" [value]="100" [striped]="true"
        [animated]="true"></ngb-progressbar>
</div>
<br>
<ng-container *ngIf="( listaServicios | filter:filtroTexto) as result">
    <h3 class="no-results" *ngIf="result.length === 0;else data">No se encontraron resultados</h3>
    <ng-template #data>
        <div class="row" style="width: 100%;">
            <div class="col-12 col-md-7 col-lg-5 col-xl-4 mt-3" *ngFor="let servicio of result">
                <div  class="card" >
                    <!-- style="min-height:40rem" [ngStyle]="{'height': servicio.IS_COLLAPSED==true ? '40rem' : '58rem'}" -->
                    <div class="relative card-body">
                        <div class="row-12">
                            <div class="barra-azul-lateralB position-absolute"></div>
                            <div class="flex-row d-flex justify-content-between sidebar-heading bold-tipografy" id="boldtipoStyleB">
                                <h4 class="mr-3"><strong>{{servicio.SER_NOMBRES}}</strong></h4>
                                <h4 class="mr-3"><strong>{{servicio.SER_PRECIO_BASE}}</strong></h4>
                            </div>
                        </div>
                        <div class="d-flex flex-row mt-3">
                            <em class="fa fa-comment" id="iconstyle"></em>
                            <div style="margin-left: 0px;" class="col">
                                <h6 style="margin-left: 0px;" class="card-text">
                                    <strong class="pr-1"><label>Descripción:</label></strong>{{servicio.SER_DESCRIPCION}}
                                </h6>
                            </div>
                        </div>
                        <div class="d-flex flex-row mt-3">
                            <em class="ml-1 fa fa-map-marker" id="iconstyle"></em>
                            <div style="margin-left: 0px;" class="col">
                                <h6 style="margin-left: 0px;" class="card-text">
                                    <strong class="pr-1"><label>Modalidad:</label></strong>
                                    {{servicio.SER_REMOTO===2?'Presencial o remoto':servicio.SER_REMOTO===1?'Remoto':'Presencial'}}
                                </h6>
                            </div>
                        </div>
                        <br>
                        <hr>
                        <br>
                        <div class="d-flex flex-row">
                            <div class="col-12 text-center"> 
                                <img class="imagen_servicio img-fluid img-thumbnail" appImgRota
                                [url]="'../../../assets/images/no-img.png'" [src]="DOMINIO+servicio.SER_IMG" alt="Imagen del servicio">
                            </div>
                        </div>
                        <div class="text-right">
                            <button class="btn_servicio btn" (click)="goToDetails('/app/cliente/datos-servicios', servicio)"><strong>Solicitar</strong></button>
                        </div>
                    </div>
                </div>
                <br>
            </div>
            <br>
        </div>
    </ng-template>
</ng-container>
